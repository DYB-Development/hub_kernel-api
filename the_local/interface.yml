scope: hub JSON API — serving a hub_kernel hub's exposed methods as a JSON API in a host Rails app, each call behind the host's own sign-in and hub_kernel-interface's permission check and account scope

install:
  - gem "hub_kernel-api"
  - HubKernel::Api.base_controller=
  - HubKernel::Api.person_method=
  - HubKernel::Api.account_method=
  - HubKernel::Api.hubs=
  - HubKernel::Api.versions=
  - HubKernel::Api::MajorVersion
  - HubKernel::Api.check!
  - HubKernel::Api::UnservableHubError
  - HubKernel::Api::UnservedMajorError
  - HubKernel::Api::RetiredMajorError
  - mount HubKernel::Api::Engine

develop:
  - GET /
  - GET /<hub>
  - GET /<hub>/<method>
  - POST /<hub>/<method>
  - Accept-Version
  - Api-Version
  - Api-Newest-Version
  - Deprecation
  - Sunset
  - Vary
  - answer_shape
  - bin/rails hub_kernel_api:describe
  - api_descriptions/v<major>.json
  - HubKernel::Api::TestHelper
  - assert_answer_shape

sources:
  - lib/hub_kernel/api.rb
  - lib/hub_kernel/api/engine.rb
  - lib/hub_kernel/api/major_version.rb
  - lib/hub_kernel/api/description.rb
  - lib/hub_kernel/api/description_files.rb
  - lib/hub_kernel/api/earlier_answers.rb
  - lib/hub_kernel/api/test_helper.rb
  - lib/tasks/hub_kernel_api.rake
  - config/routes.rb
  - app/controllers/hub_kernel/api/hub_controller.rb
  - app/controllers/hub_kernel/api/hubs_controller.rb
  - app/controllers/hub_kernel/api/hub_calls_controller.rb
  - app/controllers/hub_kernel/api/versions_controller.rb
  - README.md
